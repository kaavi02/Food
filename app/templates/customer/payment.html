{% extends "base.html" %}
{% block title %}Payment{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0">
            <div class="card-body py-5">
                <i class="bi bi-credit-card display-1 text-primary mb-3"></i>
                <h3 class="card-title">Complete Your Payment</h3>
                <p class="card-text text-muted mb-4">Order Total: <strong>₹{{ "%.2f"|format(order.total_amount) }}</strong></p>
                
                <form action="{{ url_for('customer.payment_verify') }}" method="POST" id="payment-form">
                    <input type="hidden" name="order_id" value="{{ order.id }}">
                    <!-- Hidden inputs for Razorpay response -->
                    <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
                    <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">
                    <input type="hidden" name="razorpay_signature" id="razorpay_signature">
                </form>
                
                <button id="rzp-button1" class="btn btn-primary btn-lg px-5">Pay Now</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "{{ razorpay_key }}", 
    "amount": "{{ (order.total_amount * 100)|int }}",
    "currency": "INR",
    "name": "FoodDelivery App",
    "description": "Payment for Order {{ order.order_number }}",
    "order_id": "{{ razorpay_order_id }}", 
    "handler": function (response){
        document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
        document.getElementById('razorpay_order_id').value = response.razorpay_order_id;
        document.getElementById('razorpay_signature').value = response.razorpay_signature;
        document.getElementById('payment-form').submit();
    },
    "prefill": {
        "name": "{{ current_user.first_name }} {{ current_user.last_name }}",
        "email": "{{ current_user.email }}",
        "contact": "{{ current_user.phone }}"
    },
    "method": {
        "netbanking": true,
        "card": true,
        "upi": true,
        "wallet": true,
        "paylater": true
    },
    "theme": {
        "color": "#0d6efd"
    }
};
var rzp1 = new Razorpay(options);
rzp1.on('payment.failed', function (response){
        alert("Payment Failed. Reason: " + response.error.description);
});
document.getElementById('rzp-button1').onclick = function(e){
    rzp1.open();
    e.preventDefault();
}
</script>
{% endblock %}
