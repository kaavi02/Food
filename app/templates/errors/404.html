{% extends "base.html" %}
{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center my-5 py-5">
    <div class="col-md-6 text-center">
        <div class="card border-0 shadow-sm rounded-4 p-5">
            <div class="display-1 fw-bold text-primary mb-3">404</div>
            <i class="bi bi-compass display-4 text-muted mb-3"></i>
            <h3 class="fw-bold mb-2">Oops! Page Not Found</h3>
            <p class="text-muted mb-4">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('customer.home') }}" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-house-door me-1"></i> Back to Home
                </a>
                <a href="{{ url_for('customer.restaurants') }}" class="btn btn-outline-primary px-4 py-2">
                    <i class="bi bi-shop me-1"></i> Browse Hotels
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
