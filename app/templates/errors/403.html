{% extends "base.html" %}
{% block title %}403 - Access Forbidden{% endblock %}

{% block content %}
<div class="row justify-content-center my-5 py-5">
    <div class="col-md-6 text-center">
        <div class="card border-0 shadow-sm rounded-4 p-5">
            <div class="display-1 fw-bold text-danger mb-3">403</div>
            <i class="bi bi-shield-lock display-4 text-muted mb-3"></i>
            <h3 class="fw-bold mb-2">Access Denied</h3>
            <p class="text-muted mb-4">You do not have the required permissions to view this resource. Please make sure you are logged in with the correct account role.</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('customer.home') }}" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-house-door me-1"></i> Back to Home
                </a>
                <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary px-4 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Login Again
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
